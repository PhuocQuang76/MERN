<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- <meta name="robots" content="..."> tag in HTML is used to provide instructions to 
        search engine crawlers on how to index and display a web page.  -->
        <meta name="robots" content="follow, index, max-snippet:-1, max-video-preview:-1, max-image-preview:large">

        <!-- Latest compiled and minified CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <title>Document</title>
    </head>
<body>
    <!-- below element will be used as container to load the application in single page -->
    <div id="root">        
    </div>
</body>
<!-- <script src="/dist/bundle.js"></script> -->
<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</html>
<!-- 
The <meta name="robots" content="..."> tag in HTML is used to provide instructions to search engine crawlers on how to index
 and display a web page. The robots meta tag can have different values for the content attribute, each serving a specific 
 purpose. Here are some common content values and their meanings:

index: This value tells search engine crawlers to include the page in search results.
noindex: This value instructs search engine crawlers not to include the page in search results.
follow: This value tells search engine crawlers to follow and index the links on the page.
nofollow: This value instructs search engine crawlers not to follow the links on the page.
noarchive: This value prevents search engines from storing a cached copy of the page.
nosnippet: This value prevents search engines from displaying a snippet of the page in search results.
max-snippet:-1, max-image-preview:large, etc.: These values provide specific directives related to snippets and image previews. -->
